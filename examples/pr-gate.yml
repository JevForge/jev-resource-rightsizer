name: PR rightsizing gate

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  rightsizing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate rightsizing evidence
        id: size
        uses: JevForge/jev-resource-rightsizer@v0
        with:
          metrics_path: ops/metrics.json
          comment_on_github: 'true'
          apply_labels: 'true'
          fail_on_review: 'false'
          decision_json_path: rightsizing-decision.json
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - name: Upload decision
        uses: actions/upload-artifact@v4
        with:
          name: rightsizing-decision
          path: rightsizing-decision.json
